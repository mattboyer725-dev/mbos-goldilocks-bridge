[package]
name = "mbos-goldilocks-bridge"
version = "0.8.0"
edition = "2021"
description = "Local adaptive loop with pre-flight integrity gate"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lib]
name = "mbos_goldilocks_bridge"
path = "src/lib.rs"
