[package]
name = "mbos-goldilocks-bridge"
version = "0.7.0"
edition = "2021"
description = "Local-first adaptive loop with optional controlled peer sync"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "mbos_goldilocks_bridge"
path = "src/lib.rs"
